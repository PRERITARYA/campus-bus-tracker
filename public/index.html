<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Bus Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#14262b;--muted:#5d6f74;--line:#d5dde0;--bg:#eef2f3;--panel:#fff;--accent:#0b6e79}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:1fr 390px;height:100vh}
#map{height:100%}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
h1{font-size:19px;margin:0}
h2{font-size:15px;margin:20px 0 8px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
.banner{margin-top:12px;padding:10px 12px;border-left:4px solid #d98a00;background:#fff6e0;border-radius:4px}
.banner:empty{display:none}
select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}
.eta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bus{color:#fff;font:700 11px/1 system-ui;padding:5px 6px;border-radius:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);text-align:center}
.empty{color:var(--muted);padding:6px 0}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:45vh 1fr;height:auto;min-height:100vh}aside{border-left:0}}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside>
    <div class="top"><h1>Campus Bus Tracker</h1><div class="clock" id="clock" title="Simulated time">--:--</div></div>
    <div class="banner" id="banner"></div>

    <h2>Plan a trip</h2>
    <div class="row"><select id="from" aria-label="From stop"></select><select id="to" aria-label="To stop"></select></div>
    <div class="row" style="margin-top:8px"><button id="go">Find a bus</button></div>
    <div id="plan"></div>

    <h2 id="stopTitle">Stop arrivals</h2>
    <div id="arrivals"><div class="empty">Tap a stop on the map to see the next buses.</div></div>

    <h2>Buses on the road</h2>
    <div id="buses"></div>

    <h2>Simulation controls</h2>
    <div class="row" id="scen">
      <button data-s="normal">Normal day</button><button data-s="rush">Class rush</button>
      <button data-s="traffic">Traffic delay</button><button data-s="breakdown">Breakdown</button>
      <button data-s="night">Night service</button>
    </div>
    <div class="row" style="margin-top:10px"><label for="speed">Clock speed</label>
      <select id="speed"><option value="1">1x</option><option value="10" selected>10x</option><option value="30">30x</option><option value="60">60x</option></select>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map('map').setView([20.352, 85.816], 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);

let routes = {}, stops = {}, markers = {}, selStop = null;
const clock = s => { s = Math.floor(s) % 86400; return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0'); };
const mins = s => (s < 30 ? 'Due' : Math.ceil(s / 60) + ' min');

async function init() {
  const st = await (await fetch('/api/static')).json();
  routes = st.routes; stops = st.stops;
  Object.values(routes).forEach(r => L.polyline(r.path, { color: r.color, weight: 4, opacity: 0.6 }).addTo(map));
  Object.entries(stops).forEach(([id, s]) => {
    L.circleMarker([s.lat, s.lng], { radius: 8, color: '#14262b', weight: 3, fillColor: '#fff', fillOpacity: 1 })
      .addTo(map).bindTooltip(s.name).on('click', () => selectStop(id));
    ['from', 'to'].forEach(k => $(k).add(new Option(s.name, id)));
  });
  map.fitBounds(Object.values(stops).map(s => [s.lat, s.lng]), { padding: [40, 40] });
  $('to').selectedIndex = 3;
  connect();
}

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);
}

function render(d) {
  $('clock').textContent = clock(d.simTime);
  $('banner').textContent = d.announcement;
  document.querySelectorAll('#scen button').forEach(b => b.classList.toggle('on', b.dataset.s === d.scenario));
  const seen = new Set();
  d.buses.forEach(b => {
    seen.add(b.id);
    const color = routes[b.routeId].color;
    if (!markers[b.id]) markers[b.id] = L.marker([b.lat, b.lng], { icon: L.divIcon({ className: '', iconSize: [30, 22], html: `<div class="bus" style="background:${color}">${b.id}</div>` }), zIndexOffset: 500 }).addTo(map);
    else markers[b.id].setLatLng([b.lat, b.lng]);
  });
  Object.keys(markers).forEach(id => { if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; } });
  $('buses').innerHTML = d.buses.map(b => `<div class="item"><span class="dot" style="background:${routes[b.routeId].color}"></span>
    <div class="grow"><b>${b.id}</b> <span class="sub">${b.plate}</span><div class="sub">${routes[b.routeId].name}</div></div>
    <div style="text-align:right"><div>${b.status}</div><div class="sub">${b.occupancy}</div></div></div>`).join('');
}

function selectStop(id) { selStop = id; $('stopTitle').textContent = stops[id].name; refreshArrivals(); }
async function refreshArrivals() {
  if (!selStop) return;
  const a = await (await fetch(`/api/stops/${selStop}/arrivals`)).json();
  $('arrivals').innerHTML = a.length ? a.map(x => `<div class="item"><span class="dot" style="background:${x.color}"></span>
    <div class="grow"><b>${x.route}</b><div class="sub">Bus ${x.busId} · ${x.status} · ${x.occupancy}</div></div><div class="eta">${mins(x.etaSec)}</div></div>`).join('')
    : '<div class="empty">No buses are serving this stop right now.</div>';
}
setInterval(refreshArrivals, 2000);

$('go').onclick = async () => {
  const f = $('from').value, t = $('to').value;
  if (f === t) { $('plan').innerHTML = '<div class="empty">Pick two different stops.</div>'; return; }
  const o = await (await fetch(`/api/plan?from=${f}&to=${t}`)).json();
  $('plan').innerHTML = o.length ? o.slice(0, 3).map(x => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
    <div class="eta">${Math.ceil(x.totalSec / 60)} min total${x.legs.length > 1 ? ' · 1 transfer' : ' · direct'}</div>` +
    x.legs.map((l, i) => `<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span class="dot" style="background:${l.color}"></span>
      <div class="grow"><b>${l.route}</b><div class="sub">Bus ${l.busId} · ${i ? 'change at ' + l.transferAt + ', wait ' + mins(l.waitSec) : 'arrives in ' + mins(l.waitSec)} · about ${Math.ceil(l.rideSec / 60)} min ride</div></div></div>`).join('') + '</div>').join('')
    : '<div class="empty">No bus is running between these stops right now.</div>';
};

document.querySelectorAll('#scen button').forEach(b => b.onclick = () => fetch('/api/scenario', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: b.dataset.s }) }));
$('speed').onchange = e => fetch('/api/speed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mult: e.target.value }) });
init();
</script>
</body>
</html>
